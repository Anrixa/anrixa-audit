name: publish-pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release distributions
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Validate tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys
          import tomllib

          tag = "${{ github.event.release.tag_name }}"
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              print(f"release tag mismatch: tag={tag!r} expected={expected!r}", file=sys.stderr)
              raise SystemExit(1)
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:[abrc][0-9]+)?", tag):
              print(f"unsupported release tag format: {tag}", file=sys.stderr)
              raise SystemExit(1)
          print(f"VERSION_GATE=PASS version={version} tag={tag}")
          PY

      - name: Test release source
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build twine
          python -m pip install .
          python -m pytest

      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for path in sorted(Path("dist").iterdir()):
              print(hashlib.sha256(path.read_bytes()).hexdigest(), path)
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/anrixa-audit
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-dist
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
